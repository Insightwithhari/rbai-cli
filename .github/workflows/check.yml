# Checks that the repository's files are well formed. It needs no secrets and runs on GitHub's own runners.
name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: JSON files parse
        run: git ls-files -z '*.json' | xargs -0 -n1 jq empty
      - name: YAML files parse
        run: git ls-files -z '*.yml' '*.yaml' '*.cff' | xargs -0 -n1 yq eval '.' > /dev/null
      - name: The install script has no shell errors
        run: shellcheck --severity=error install/install.sh
      - name: The PowerShell installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
