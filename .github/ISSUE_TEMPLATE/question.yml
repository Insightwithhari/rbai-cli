name: Question
description: Ask how to do something with rbai.
title: "Question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried so far.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rbai version
      description: What `rbai --version` prints, if you have rbai installed.
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you send
      options:
        - label: I haven't included an API key, a sign-in code or a token.
          required: true
